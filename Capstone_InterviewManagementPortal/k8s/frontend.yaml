apiVersion: apps/v1
kind: Deployment
metadata:
  name: interview-frontend
  namespace: interview-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: interview-frontend
  template:
    metadata:
      labels:
        app: interview-frontend
    spec:
      containers:
      - name: interview-frontend
        image: prachiverma26/interview-frontend:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 5173

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: interview-management
spec:
  type: NodePort
  selector:
    app: interview-frontend
  ports:
    - port: 5173
      targetPort: 5173
      nodePort: 30000